<html lang="en">

<meta charset="utf-8">

<title>India Year Book 2026 · VibhillionAI</title>
<script>

if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
</script>
<style>
:root{
  --bg:#FBF8F0; --card:#FFFFFF; --card2:#F3EEDF; --ink:#1E2A21; --sub:#6B6558; --line:rgba(154,107,8,.22);
  --forest:#14532D; --sea:#2E8B57; --teal:#0F8577; --olive:#6B8E23; --mint:#6FCF97;
  --saffron:#D9720A; --chakra:#0B3D91; --gold:#9A6B08;
  --glass:rgba(251,248,240,.96);
  --serif:Georgia,'Noto Serif','Times New Roman',serif;
  --mono:'Courier New',Courier,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
}
html[data-theme="dark"]{color-scheme:dark;
  --bg:#0C1511; --card:#14211A; --card2:#1A2B21; --ink:#E6EFE8; --sub:#9DB0A4; --line:rgba(111,207,151,.2);
  --forest:#1F7A44; --glass:rgba(12,21,17,.96); --gold:#E3B25A; --saffron:#FF9A3D;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
svg{flex:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:58px;display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;background:var(--glass);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#FF9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
html[data-theme="dark"] .topbar::after{background:linear-gradient(90deg,#FF9933 0 33.3%,#d8d8d8 33.3% 66.6%,#138808 66.6%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:36px;height:36px;border-radius:10px;flex:none}
.brand b{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.15}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--sub)}
.tb-title{flex:1;min-width:0;line-height:1.2;padding-left:2px}
.tb-title b{display:block;font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:44px;border:0;background:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ib:hover{background:var(--card2)}
.ib[aria-disabled="true"]{opacity:.28;pointer-events:none}
.theme-btn svg{display:none}
html:not([data-theme="dark"]) .theme-btn .i-moon{display:block}
html[data-theme="dark"] .theme-btn .i-sun{display:block}
.logo-only{width:36px;height:36px;border-radius:10px;flex:none}

/* ---------- layout ---------- */
.view{max-width:860px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px}
.fade{animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:22px 20px 20px;background:
  radial-gradient(circle at 88% 12%,rgba(255,255,255,.14),transparent 45%),linear-gradient(135deg,#14532D 0%,#0F8577 100%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#FF9933 0 33.3%,#fff 33.3% 66.6%,#138808 66.6%)}
.hero .chakra{position:absolute;right:-26px;top:-26px;width:150px;height:150px;opacity:.28}
.eyebrow{position:relative;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.14em;color:#FFD9A8}
.hero h1{position:relative;font-family:var(--serif);font-size:30px;line-height:1.15;margin:8px 0 6px;max-width:calc(100% - 60px)}
.hero p{position:relative;font-size:13.5px;line-height:1.6;color:#E3F3EA;max-width:560px}
.stats{position:relative;display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{padding:9px 14px;border-radius:14px;background:rgba(0,0,0,.24);min-width:92px}
.stat b{display:block;font-family:var(--mono);font-size:22px;color:#FFC46B}
.stat span{font-size:11.5px;color:#D5EBDD}
.bar{position:relative;margin-top:14px;height:8px;border-radius:99px;background:rgba(0,0,0,.28);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB05A,#6FCF97)}

/* ---------- search + continue ---------- */
.search label{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px}
.search label:focus-within{border-color:var(--sea)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px;color:var(--ink)}
.search input::placeholder{color:var(--sub)}
.cont{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--saffron)}
.cont .t{flex:1;min-width:0}
.cont .k{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--saffron)}
.cont b{display:block;font-family:var(--serif);font-size:16px;margin-top:2px}
.cont span{font-size:12px;color:var(--sub)}
.go{width:40px;height:40px;border-radius:50%;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center}

/* ---------- parts ---------- */
.sec-title{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--sub);padding-left:2px}
.part{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;border-left:6px solid var(--pc)}
.part>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer;min-height:64px}
.part>summary::-webkit-details-marker{display:none}
.roman{flex:none;min-width:44px;height:44px;border-radius:12px;background:var(--pc);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:16px}
.part .pt{flex:1;min-width:0}
.part .pt b{display:block;font-family:var(--serif);font-size:15.5px;line-height:1.25}
.part .pt small{font-family:var(--mono);font-size:10.5px;color:var(--sub);letter-spacing:.06em}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--sub);white-space:nowrap}
.pill.done{background:var(--pc);color:#fff}
.chev{transition:transform .2s;color:var(--sub)}
.part[open] .chev{transform:rotate(180deg)}
.chs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.ch:last-child{border-bottom:0}
.ch .no{flex:none;width:34px;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--pc)}
.ch .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.35}
.ch.ready:hover{background:var(--card2)}
.ch .st{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.04em}
.ch.ready .st{color:var(--sea)}
.ch.soon{opacity:.55}
.ch.soon .st{color:var(--sub)}
.ch .arr{flex:none;color:var(--pc)}

/* ---------- search results / misc ---------- */
.res{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;gap:12px;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pc)}
.rrow .no{font-family:var(--mono);font-weight:700;color:var(--pc);width:30px;flex:none}
.rrow b{display:block;font-family:var(--serif);font-size:15.5px}
.rrow small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.rrow mark{background:rgba(255,154,61,.35);color:inherit;border-radius:3px}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:14px;background:var(--card);border:1.5px dashed var(--line);border-radius:18px}
.note{padding:13px 14px;border-radius:14px;background:var(--card2);font-size:12.5px;line-height:1.55;border-left:4px solid var(--saffron)}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--sub)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sea);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{margin-top:6px;padding:20px 16px;text-align:center;font-size:12px;color:var(--sub);border-top:1px solid var(--line)}
.foot .pillf{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:99px;background:var(--forest);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700}

/* ---------- full-screen chapter ---------- */
body.reading{overflow:hidden}
iframe.chapter{position:fixed;left:0;right:0;bottom:0;top:61px;width:100%;height:calc(100% - 61px);border:0;background:#FBF8F0;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var root=document.documentElement, meta=document.querySelector('meta[name="theme-color"]'), mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');
  function paint(){ if(meta) meta.setAttribute('content', root.getAttribute('data-theme')==='dark'?'#0C1511':'#14532D'); }
  function setTheme(t,save){ if(t==='dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme'); paint();
    if(save){ try{localStorage.setItem('iyb_theme',t);}catch(e){} } }
  paint();
  document.getElementById('themeBtn').addEventListener('click',function(){ setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark',true); });
  if(mq&&mq.addEventListener) mq.addEventListener('change',function(e){ var sv=null; try{sv=localStorage.getItem('iyb_theme');}catch(_){} if(!sv) setTheme(e.matches?'dark':'light',false); });
})();
</script>

/* ============ data ============ */
var PARTS=[], CHS=[];   // CHS: every chapter in book order, with part info
function build(data){
  PARTS=(data&&data.parts)||[]; CHS=[];

}
function byN(n){for(var i=0;i<CHS.length;i++) if(CHS[i].n===n) return CHS[i]; return null;}
function readyList(){return CHS.filter(function(c){return c.ready;});}
function url(c){return CONFIG.siteBase+encodeURI(c.path);}
function ttl(c){return (c.span&&c.span.length>1&&c.fileTitle)?c.fileTitle:c.title;}

/* ============ chrome ============ */

function chrome(o){
  $('#brandTxt').hidden=!!o.back;                          // logo stays on inner pages, name hides
  var b=$('#backBtn'); b.hidden=!o.back; if(o.back) b.setAttribute('href',o.back);

}

}

function read(n){

  if(q){
    var terms=q.toLowerCase().split(/\s+/);
    re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    readyList().forEach(function(c){
      var hay=(c.title+' '+c.part.name+' '+(c.sections||[]).join(' ')).toLowerCase();
      if(terms.every(function(t){return hay.indexOf(t)>=0;})){
        var hit=(c.sections||[]).filter(function(s){return terms.some(function(t){return s.toLowerCase().indexOf(t)>=0;});}).slice(0,3);
        res.push([c,hit]);
      }
    });
  }
  var hl=function(s){return esc(s).replace(re||/$^/,'<mark>$1</mark>');};
  view.innerHTML='<form class="search" role="search" onsubmit="return false"><label>'+SEARCH+'<input id="q" type="search" autocomplete="off" value="'+esc(q)+'" placeholder="Search chapter or topic"></label></form>'+
    (!q?'<div class="empty">Type a chapter name or a topic, e.g. <i>Polity</i>, <i>Railways</i>.</div>':
      res.length?'<div class="res">'+res.slice(0,60).map(function(r){var c=r[0];return '<a class="rrow" style="--pc:'+c.part.color+'" href="#/read/'+c.n+'"><span class="no">'+(c.n<10?'0':'')+c.n+'</span><span><b>'+hl(c.title)+'</b><small>Part '+esc(c.part.roman)+' · '+esc(c.part.name)+'</small>'+(r[1].length?'<small>'+r[1].map(hl).join(' · ')+'</small>':'')+'</span></a>';}).join('')+'</div>':
      '<div class="empty">No chapter matches “'+esc(q)+'”.</div>');
  var inp=$('#q'),tm; if(inp){ if(!q) inp.focus();
    inp.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){history.replaceState(null,'','#/search/'+encodeURIComponent(inp.value.trim()));route();},350);});}
}
function nf(){chrome({back:'#/',title:'Not found'});view.innerHTML='<div class="empty">This chapter is not added yet. <a href="#/" style="color:var(--sea);font-weight:700">Go to the book</a></div>';}

/* ============ router ============ */
function route(){
  var p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);
  if(p[0]==='read') {read(parseInt(p[1],10)); return;}
  window.scrollTo(0,0);
  if(p[0]==='search') search(p.slice(1).join('/')); else home();
}
window.addEventListener('hashchange',route);

/* ============ boot ============ */
view.innerHTML='<div class="loading"><span class="spin"></span>Loading…</div>';
fetch(CONFIG.siteBase+CONFIG.indexJson,{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(d){build(d);route();})
  .catch(function(){build({parts:[]});route();view.insertAdjacentHTML('afterbegin','<div class="note">Could not load <b>content-index.json</b>. Check the internet connection, and that the <b>Actions</b> tab of the repo shows a green run of the Pages workflow.</div>');});
})();
</script>
</body>
</html>
